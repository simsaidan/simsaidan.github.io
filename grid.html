<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Grid | Aidan Sims</title>
  <meta name="description"
    content="Daily 3×3 tennis player puzzle — match players to row and column categories.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://simsaidan.github.io/grid.html">
  <meta property="og:title" content="Tennis Grid | Aidan Sims">
  <meta property="og:description"
    content="Daily 3×3 tennis player puzzle — match players to row and column categories.">
  <meta property="og:url" content="https://simsaidan.github.io/grid.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Aidan Sims">
  <meta property="og:image" content="https://simsaidan.github.io/images/racket.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tennis Grid | Aidan Sims">
  <meta name="twitter:description"
    content="Daily 3×3 tennis player puzzle — match players to row and column categories.">
  <meta name="twitter:image" content="https://simsaidan.github.io/images/racket.png">
  <link rel="stylesheet" href="css/standalone.css">
  <link rel="stylesheet" href="css/grid.css">
</head>

<body>
  <a href="/" class="standalone-home">← Aidan Sims</a>
  <button type="button" class="info-btn" onclick="showIntro()" aria-label="How to play">ℹ️</button>

  <main>
    <h1 id="Grid Number">Tennis Grid</h1>
    <p class="day" aria-live="polite"></p>

    <table class="grid">
      <tr>
        <td><img src="images/racket.png" width="160" height="160" alt=""></td>
        <td id="leftCol" title="Cats rule" class="category"></td>
        <td id="midCol" class="category"></td>
        <td id="rightCol" class="category"></td>
      </tr>

      <tr>
        <td id="topRow" class="category"></td>
        <td id="button1" class="button"><button type="button" onclick="openForm('button1')" aria-label="Guess cell 1"></button></td>
        <td id="button2" class="button"><button type="button" onclick="openForm('button2')" aria-label="Guess cell 2"></button></td>
        <td id="button3" class="button"><button type="button" onclick="openForm('button3')" aria-label="Guess cell 3"></button></td>
      </tr>

      <tr>
        <td id="midRow" class="category"></td>
        <td id="button4" class="button"><button type="button" onclick="openForm('button4')" aria-label="Guess cell 4"></button></td>
        <td id="button5" class="button"><button type="button" onclick="openForm('button5')" aria-label="Guess cell 5"></button></td>
        <td id="button6" class="button"><button type="button" onclick="openForm('button6')" aria-label="Guess cell 6"></button></td>
      </tr>

      <tr>
        <td id="bottomRow" class="category"></td>
        <td id="button7" class="button"><button type="button" onclick="openForm('button7')" aria-label="Guess cell 7"></button></td>
        <td id="button8" class="button"><button type="button" onclick="openForm('button8')" aria-label="Guess cell 8"></button></td>
        <td id="button9" class="button"><button type="button" onclick="openForm('button9')" aria-label="Guess cell 9"></button></td>
      </tr>
    </table>

    <div class="guesses">
      <p>Guesses left:</p>
      <p class="guesses-left">9</p>
      <button type="button" id="giveUp" onclick="giveUp()">Give up</button>
    </div>
  </main>

  <div class="form-popup" id="myForm" role="dialog" aria-modal="true" aria-labelledby="guessFormTitle">
    <p id="guessFormTitle" class="form-popup-title">Enter player</p>
    <label for="email">Player:</label>
    <input onkeyup="suggestions()" id="email" required list="emailSuggestions" autocomplete="off">

    <datalist id="emailSuggestions"></datalist>

    <button type="button" class="btn" onclick="submit()">Enter</button>
    <button type="button" class="btn cancel" onclick="closeForm()">Back</button>
  </div>

  <div id="resultPopup" class="modal-overlay" role="dialog" aria-modal="true"
    aria-labelledby="resultTitle">
    <div class="modal-card">
      <h2 id="resultTitle" class="visually-hidden">Results</h2>
      <div id="resultText" class="modal-text"></div>
      <div class="modal-actions">
        <button type="button" onclick="copyResult()">Copy to Clipboard</button>
        <span id="copyStatus" class="copy-status" aria-live="polite"></span>
        <button type="button" onclick="closeResult()">Close</button>
      </div>
    </div>
  </div>

  <div id="introPopup" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="modal-card modal-card--scroll">
      <h2 id="introTitle" class="visually-hidden">How to play</h2>
      <div id="introText" class="modal-text"></div>
      <button type="button" class="modal-ok" onclick="closeIntro()">OK</button>
    </div>
  </div>

  <script src="js/modal-focus.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
  <script src="grid.js" defer></script>
</body>

</html>
