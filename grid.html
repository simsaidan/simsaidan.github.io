<!DOCTYPE html>
<html>

<head>
  <title>Tennis Grid</title>
  <link rel="stylesheet" href="grid.css">
</head>

<body>

  <h1 id="Grid Number">Tennis Grid</h1>
  <h5 class="day"></h5>

  <table class="grid">
    <tr>
      <td><img src="racket.png" width="160" height="160"></td>
      <td id="leftCol" title="Cats rule" class="category"></td>
      <td id="midCol" class="category"></td>
      <td id="rightCol" class="category"></td>
    </tr>

    <tr>
      <td id="topRow" class="category"></td>
      <td id="button1" class="button"><button onclick="openForm('button1')"></button></td>
      <td id="button2" class="button"><button onclick="openForm('button2')"></button></td>
      <td id="button3" class="button"><button onclick="openForm('button3')"></button></td>
    </tr>

    <tr>
      <td id="midRow" class="category"></td>
      <td id="button4" class="button"><button onclick="openForm('button4')"></button></td>
      <td id="button5" class="button"><button onclick="openForm('button5')"></button></td>
      <td id="button6" class="button"><button onclick="openForm('button6')"></button></td>
    </tr>

    <tr>
      <td id="bottomRow" class="category"></td>
      <td id="button7" class="button"><button onclick="openForm('button7')"></button></td>
      <td id="button8" class="button"><button onclick="openForm('button8')"></button></td>
      <td id="button9" class="button"><button onclick="openForm('button9')"></button></td>
    </tr>
  </table>

  <div class="guesses">
    <p>Guesses left:</p>
    <p class="guesses-left">9</p>

    <button id="giveUp" onclick="giveUp()">Give up</button>
  </div>

  <div class="form-popup" id="myForm">


    <label for="email">Player:</label>
    <input onkeyup="suggestions()" id="email" required list="emailSuggestions">

    <datalist id="emailSuggestions">
    </datalist>

    <button type="button" class="btn" onclick="submit()">Enter</button>
    <button type="button" class="btn cancel" onclick="closeForm()">Back</button>
  </div>

  <div id="resultPopup"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:white; padding:20px; border-radius:8px; max-width:90%; text-align:left;">
      <div id="resultText" style="white-space:pre-wrap; font-family:inherit;"></div>
      <br>
      <button onclick="copyResult()">Copy to Clipboard</button>
      <span id="copyStatus" style="margin-left: 10px; color: green; font-weight: bold;"></span>
      <button onclick="closeResult()">Close</button>
    </div>
  </div>


  <script src="grid.js"></script>
</body>

</html>
