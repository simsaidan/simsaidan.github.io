<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Small Spinning Globe</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background-color: white;
      overflow: hidden;
    }

    #globeViz {
      width: 300px;
      height: 300px;
      position: absolute;
      top: 50px;
      left: 50px;
    }

    #globeViz canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>

<body>
  <h1>Experiment</h1>
  <div id="globeViz"></div>
  <h2>Experiment</h2>

  <!-- Load Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    const container = document.getElementById('globeViz');

    const world = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg');

    // Make background transparent
    world.renderer().setClearColor(0x000000, 0);
    world.scene().background = null;

    // Resize renderer to container
    const resize = () => {
      const width = container.offsetWidth;
      const height = container.offsetHeight;

      const renderer = world.renderer();
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);

      const camera = world.camera();
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    };
    resize();

    // Zoom camera out so globe looks small
    world.camera().position.z = 500; // increase this to make the globe smaller
    world.controls().update();

    // Spin the globe
    let angle = 0;
    setInterval(() => {
      angle += 0.0015;
      world.controls().autoRotate = false;
      world.pointOfView({ lat: 0, lng: angle * 180 / Math.PI }, 0);
    }, 30);
  </script>
</body>

</html>
