<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Globe Test</title>
  <style>
    html,
    body {
      margin: 0;
      background: white;
      font-family: sans-serif;
    }

    #globeContainer {
      width: 1100px;
      height: 500px;
      left: -400px;
      position: relative;
      overflow: hidden;
      display: inline-block;
      vertical-align: top;
      border: 1px solid #ccc;
    }

    #globeContainer canvas {
      position: absolute !important;
      width: 100% !important;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
    }

    #otherContent {
      display: inline-block;
      padding: 20px;
    }
  </style>
</head>

<body>

  <h1>Experiment</h1>

  <div id="globeContainer"></div>

  <div id="otherContent">
    <h2>This should not be hidden</h2>
    <p>The globe is small and stays in its box!</p>
  </div>

  <script src="https://unpkg.com/globe.gl"></script>
  <script>
    const container = document.getElementById('globeContainer');

    const globe = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png');

    // Transparent background
    globe.renderer().setClearColor(0x000000, 0);
    globe.scene().background = null;

    // Force canvas to fit container
    const width = container.offsetWidth;
    const height = container.offsetHeight;
    globe.renderer().setSize(width, height);
    globe.camera().aspect = width / height;
    globe.camera().updateProjectionMatrix();

    // Manually zoom out and center the globe
    globe.camera().position.z = 1300;
    globe.controls().target.set(0, 0, 0);
    globe.controls().update();

    // Spin the globe
    let angle = 0;
    setInterval(() => {
      angle += 0.004;
      globe.controls().autoRotate = false;
      globe.pointOfView({ lat: 0, lng: angle * 180 / Math.PI, altitude: 5.2 }, 0);
    }, 30);

    // 🌍 Add user location via IP
    fetch('https://ipapi.co/json/')
      .then(res => res.json())
      .then(location => {
        const lat = location.latitude;
        const lng = location.longitude;

        const pointData = [{ lat, lng }];

        // Set styles first
        globe
          .pointColor(() => 'red')
          .pointAltitude(0.03)
          .pointRadius(0.5)
          .pointsData(pointData); // Set data LAST

        // Optionally zoom in to visitor's location for a second
        globe.pointOfView({ lat, lng, altitude: 2 }, 3000);
      })
      .catch(err => {
        console.error("Could not fetch user location:", err);
      });
  </script>
</body>

</html>
