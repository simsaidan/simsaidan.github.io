<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Small Globe Example</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: white;
      font-family: sans-serif;
    }

    #globeContainer {
      width: 300px;
      height: 300px;
      position: relative;
      overflow: hidden;
      border: 1px solid #ccc;
    }

    /* Constrain the internal canvas manually */
    #globeContainer canvas {
      position: absolute !important;
      width: 100% !important;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
    }

    #otherContent {
      padding: 20px;
    }
  </style>
</head>

<body>
  <h1>Experiment</h1>

  <div style="display: flex; gap: 40px; align-items: flex-start;">
    <div id="globeContainer"></div>

    <div id="otherContent">
      <h2>Another Heading</h2>
      <p>This content is no longer hidden behind the canvas.</p>
    </div>
  </div>

  <!-- Load Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    const container = document.getElementById('globeContainer');

    const globe = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg');

    // Transparent background
    globe.renderer().setClearColor(0x000000, 0);
    globe.scene().background = null;

    // Resize canvas manually to container
    const resizeGlobe = () => {
      const width = container.offsetWidth;
      const height = container.offsetHeight;

      globe.renderer().setSize(width, height);
      globe.camera().aspect = width / height;
      globe.camera().updateProjectionMatrix();
    };
    resizeGlobe();

    // Zoom camera out to make globe small
    globe.camera().position.z = 500;
    globe.controls().update();

    // Spin the globe
    let angle = 0;
    setInterval(() => {
      angle += 0.0015;
      globe.controls().autoRotate = false;
      globe.pointOfView({ lat: 0, lng: angle * 180 / Math.PI }, 0);
    }, 30);
  </script>
</body>

</html>
