<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinning Globe</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background-color: white;
      overflow: hidden;
    }

    #globeViz {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 300px;
      height: 300px;
      pointer-events: none;
      /* optional: disables mouse interaction */
    }

    #globeViz canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>

<body>
  <h1>Experiment</h1>
  <div id="globeViz"></div>

  <!-- Load Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    // Make sure this is AFTER the DOM is loaded
    const container = document.getElementById('globeViz');

    const world = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg');

    // Set transparent background
    world.renderer().setClearColor(0x000000, 0);
    world.scene().background = null;

    // Force renderer and camera to use container's size
    const resizeRenderer = () => {
      const width = container.offsetWidth;
      const height = container.offsetHeight;

      world.renderer().setSize(width, height);
      world.renderer().setPixelRatio(window.devicePixelRatio);

      world.camera().aspect = width / height;
      world.camera().updateProjectionMatrix();
    };

    resizeRenderer(); // Call once to set the size
    window.addEventListener('resize', resizeRenderer); // Optional: responsive resize

    // Make the globe spin
    let angle = 0;
    setInterval(() => {
      angle += 0.015;
      world.controls().autoRotate = false;
      world.pointOfView({ lat: 0, lng: angle * 180 / Math.PI }, 0);
    }, 30);
  </script>
</body>

</html>
