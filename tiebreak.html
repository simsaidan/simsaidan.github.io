<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinning Globe</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: white;
      /* Optional: set background to white */
    }

    #globeViz {
      width: 400px;
      height: 400px;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      background-color: transparent;
    }
  </style>
</head>

<body>
  <div id="globeViz"></div>

  <!-- Load Globe.gl from CDN -->
  <script src="https://unpkg.com/three-globe"></script>
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three-globe"></script>
  <script>
    const globeContainer = document.getElementById('globeViz');

    // Create the Globe instance
    const world = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg');

    // Make background transparent
    const renderer = world.renderer();
    renderer.setClearColor(0x000000, 0); // 0 alpha = transparent

    // Optional: Disable auto background fill color
    world.scene().background = null;

    // Make the globe spin
    let angle = 0;
    setInterval(() => {
      angle += 0.0015;
      world.controls().autoRotate = false;
      world.pointOfView({ lat: 0, lng: angle * 180 / Math.PI }, 0);
    }, 30);
  </script>
</body>

</html>
