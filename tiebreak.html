<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Small Spinning Globe</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: white;
      font-family: sans-serif;
    }

    #globeViz {
      width: 300px;
      height: 300px;
      position: relative;
      display: inline-block;
      z-index: 1;
    }

    #globeViz canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      position: relative !important;
      z-index: 1;
    }

    #content {
      position: relative;
      z-index: 0;
      padding: 20px;
    }
  </style>
</head>

<body>
  <h1>Experiment</h1>
  <div style="display: flex; gap: 20px;">
    <div id="globeViz"></div>
    <div id="content">
      <h2>Experiment</h2>
      <p>This content should appear next to the globe, not behind it.</p>
    </div>
  </div>

  <!-- Load Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    const container = document.getElementById('globeViz');

    const world = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg');

    // Transparent background
    world.renderer().setClearColor(0x000000, 0);
    world.scene().background = null;

    // Resize canvas to match container
    const resize = () => {
      const width = container.offsetWidth;
      const height = container.offsetHeight;

      world.renderer().setSize(width, height);
      world.renderer().setPixelRatio(window.devicePixelRatio);

      world.camera().aspect = width / height;
      world.camera().updateProjectionMatrix();
    };
    resize();

    // Move the camera back to shrink the globe
    world.camera().position.z = 500;
    world.controls().update();

    // Spin the globe
    let angle = 0;
    setInterval(() => {
      angle += 0.0015;
      world.controls().autoRotate = false;
      world.pointOfView({ lat: 0, lng: angle * 180 / Math.PI }, 0);
    }, 30);
  </script>
</body>

</html>
