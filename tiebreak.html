<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinning Globe</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }

    #globeViz {
      width: 60vw;
      /* Smaller width */
      height: 60vw;
      /* Smaller height */
      position: absolute;

      /* Vertically center */
      /*left: 45%;
      /* Align left edge */

      /* Adjust vertical center */
    }

    #globeViz canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>
  <h1>Experiment</h1>
  <div id="globeViz"></div>

  <!-- Load Globe.gl from CDN -->
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg')

    world.renderer().setClearColor(0x000000, 0);
    world.scene().background = null;


    // Make the globe spin
    let angle = 0;
    setInterval(() => {
      angle += 0.0015;
      world.controls().autoRotate = false;
      world.pointOfView({ lat: 0, lng: angle * 180 / Math.PI }, 0);
    }, 30);
  </script>
</body>

</html>
